<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkyCast Pro | Weather App</title>
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="icon" type="image/png" href="cloudw.png">
</head>
<body>
  <div class="bg-animation"></div>

  <div class="app-container">
    <h1 class="title"><i class="fa-solid fa-cloud-sun"></i> SkyCast Pro</h1>

    <div class="top-bar">
      <div class="search-box">
        <input type="text" id="Input" placeholder="Search city...">
        <button id="btn"><i class="fa-solid fa-magnifying-glass"></i></button>
      </div>

      <button id="locationBtn" class="location-btn">
        <i class="fa-solid fa-location-crosshairs"></i>
      </button>
    </div>

    <div class="datetime">
      <p id="date"></p>
      <p id="time"></p>
    </div>

    <div class="loading" id="loading">Loading...</div>

    <div class="weather-box" id="weatherBox">
      <div class="weather-main">
        <div class="left">
          <h2 id="City"></h2>
          <p id="cldd"></p>
          <h1 id="Temp"></h1>
          <p id="feelsLike"></p>
        </div>

        <div class="right">
          <img id="weatherIcon" src="" alt="Weather Icon">
        </div>
      </div>

      <div class="weather-info">
        <div class="card"><i class="fa-solid fa-wind"></i><span id="wind"></span></div>
        <div class="card"><i class="fa-solid fa-droplet"></i><span id="humidity"></span></div>
        <div class="card"><i class="fa-solid fa-gauge-high"></i><span id="pressure"></span></div>
        <div class="card"><i class="fa-solid fa-sun"></i><span id="sunrise"></span></div>
        <div class="card"><i class="fa-solid fa-moon"></i><span id="sunset"></span></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
